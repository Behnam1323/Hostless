build:
  system: docker
  min_cpu: 0.5
  max_cpu: 2
  min_memory: 256
  max_memory: 1024

dockerfile_path: ./Dockerfile
working_directory: /
build_context_directory: /

start_command: /usr/local/bin/docker-entrypoint.sh

scaling:
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 1
  min_memory: 128
  max_memory: 512

health_check:
  type: tcp
  interval_in_seconds: 15
